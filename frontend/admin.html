
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>CyberLens Admin</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#0f172a}
.wrap{max-width:1000px;margin:30px auto;padding:20px}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1,h2{margin-top:0}
input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px;width:220px}
button{padding:10px 14px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;margin:4px}
button.danger{background:#dc2626}
button.ok{background:#16a34a}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border-bottom:1px solid #e2e8f0;padding:10px;text-align:left}
.badge{padding:5px 9px;border-radius:999px;background:#e2e8f0}
.msg{color:#dc2626;font-weight:bold}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>CyberLens Admin Panel</h1>
<p><a href="/">Back to CyberLens</a></p>
<p id="status">Checking login status...</p>
</div>

<div id="loginBox" class="card" style="display:none">
<h2>Admin Login</h2>
<input id="loginUser" placeholder="Username">
<input id="loginPass" placeholder="Password" type="password">
<button onclick="login()">Login</button>
<p id="loginMsg" class="msg"></p>
</div>

<div id="adminBox" style="display:none">
<div class="card">
<h2>Create New User</h2>
<input id="newUser" placeholder="Username">
<input id="newPass" placeholder="Password">
<button onclick="createUser()">Create User</button>
<p id="createMsg" class="msg"></p>
</div>

<div class="card">
<h2>Users</h2>
<button onclick="loadUsers()">Refresh</button>
<table>
<thead>
<tr>
<th>ID</th>
<th>Username</th>
<th>Admin</th>
<th>Status</th>
<th>Scans</th>
<th>Action</th>
</tr>
</thead>
<tbody id="usersBody"></tbody>
</table>
</div>
</div>
</div>

<script>
function post(url,data){
 return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(data||{})})
 .then(r=>r.json().then(j=>({status:r.status,json:j})));
}
function get(url){
 return fetch(url,{credentials:"same-origin"}).then(r=>r.json().then(j=>({status:r.status,json:j})));
}
function check(){
 get("/api/auth/me").then(res=>{
  const d=res.json.data||{};
  if(!d.authenticated){
   document.getElementById("status").textContent="Please login with an admin account.";
   document.getElementById("loginBox").style.display="block";
   return;
  }
  if(!d.user || Number(d.user.is_admin)!==1){
   document.getElementById("status").textContent="This account is not Admin.";
   return;
  }
  document.getElementById("status").textContent="Welcome " + d.user.username + " - Admin account";
  document.getElementById("loginBox").style.display="none";
  document.getElementById("adminBox").style.display="block";
  loadUsers();
 });
}
function login(){
 post("/api/auth/login",{
  username:document.getElementById("loginUser").value,
  password:document.getElementById("loginPass").value
 }).then(res=>{
  if(res.status===200){check();return;}
  document.getElementById("loginMsg").textContent=res.json.message||"Login failed";
 });
}
function createUser(){
 post("/api/admin/users",{
  username:document.getElementById("newUser").value,
  password:document.getElementById("newPass").value
 }).then(res=>{
  document.getElementById("createMsg").textContent=res.json.message||"";
  if(res.status===200){
   document.getElementById("newUser").value="";
   document.getElementById("newPass").value="";
   loadUsers();
  }
 });
}
function setActive(id,value){
 post("/api/admin/users/"+id+"/active",{is_active:value}).then(()=>loadUsers());
}
function loadUsers(){get("/api/admin/users").then(res=>{
  const body=document.getElementById("usersBody");
  body.innerHTML="";
  const users=res.json.data||[];
  users.forEach(u=>{
   const tr=document.createElement("tr");
   const active=Number(u.is_active)===1;
   const admin=Number(u.is_admin)===1;
   tr.innerHTML=
    "<td>"+u.id+"</td>"+
    "<td>"+u.username+"</td>"+
    "<td>"+(admin?"Yes":"No")+"</td>"+
    "<td><span class='badge'>"+(active?"Active":"Disabled")+"</span></td>"+
    "<td>"+(u.scans_count||0)+"</td>"+
    "<td></td>";
   const td=tr.lastChild;
   if(!admin){
    const btn=document.createElement("button");
    btn.className=active?"danger":"ok";
    btn.textContent=active?"Disable":"Enable";
    btn.onclick=function(){setActive(u.id,!active)};
    td.appendChild(btn);
   }else{
    td.textContent="Admin";
   }
   body.appendChild(tr);
  });
 });
}
check();
</script>
</body>
</html>
